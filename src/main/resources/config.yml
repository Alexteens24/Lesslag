# =============================================================
#  LessLag - Configuration
#  Version: 1.4
# =============================================================

# Internal config version — do NOT edit manually.
# Used by ConfigUpdater to auto-migrate missing keys after plugin updates.
config-version: 6

core:
  # Messages prefix
  prefix: "<aqua><bold>LessLag <dark_gray>» <gray>"
  # Check for updates on startup
  check-updates: true
  # Language file to use (messages_{language}.yml)
  language: en
  # Print debug messages to console
  debug: false
  # Number of threads for async background tasks (monitoring, analysis, web)
  # Increase on high-core servers (8+ cores) if you notice monitoring delays.
  async-threads: 4

# =============================================================
#  WEB OPTIMIZER
#  Connect your server to the LessLag web dashboard.
# =============================================================
web:
  # LessLag API endpoint (rate limited: 30 req / 60s)
  api-url: "https://lesslag-api.daucatmoitu.workers.dev"
  # Web dashboard URL
  dashboard-url: "https://lesslag-web.vercel.app"
  # Timeout (seconds) for all outbound HTTP requests to the LessLag API
  http-timeout-seconds: 10
  # Server identity — populated automatically on first startup via /lg web register
  server-id: ""
  server-secret: ""
  # Heartbeat: keep the dashboard "online" badge alive
  heartbeat:
    enabled: true
    interval-seconds: 30
  # Apply-queue: receive config patches from the web dashboard
  apply-queue:
    enabled: false
    poll-interval-seconds: 60
    # Auto-confirm SAFE/BALANCED patches after this many seconds (0 = disable)
    auto-confirm-seconds: 300

# Max time (ms) per tick for heavy tasks (WorkloadDistributor)
workload-limit-ms: 2
# If MSPT exceeds this threshold, WorkloadDistributor reduces its budget to
# workload-emergency-budget-ms to give the server room to recover.
workload-emergency-mspt: 45
# Budget (ms) used during emergency throttle. Fractional values (e.g. 0.5) are allowed.
workload-emergency-budget-ms: 0.5
# Max items in the low-priority (background) workload queue before oldest items are replaced.
workload-queue-usage-limit: 2000
# Max items in the high-priority (user commands/restores) workload queue before drops occur.
workload-queue-high-limit: 5000
# Warn if a single workload task takes longer than this (ms).
workload-task-warn-ms: 50

# =============================================================
#  MODULES: Protection & Optimization
#
#  Tier guide:
#    (no label)     Core        — enabled by default, safe for all servers
#    [ADVANCED]      Advanced    — opt-in, recommended for specific server types
#    [EXPERIMENTAL]  Experimental — opt-in, complex heuristics, may produce false positives
#    [EMERGENCY]     Emergency   — disabled by default, disruptive last-resort actions
# =============================================================

modules:
  # -----------------------------------------------------------
  # Redstone Control
  # Prevents lag machines and optimizing redstone circuits.
  # -----------------------------------------------------------
  redstone:
    enabled: true
    # Stabilization (Suppressor)
    # How many times a chunk can activate redstone before being suppressed?
    max-activations-per-chunk: 250
    # How lengthy (in seconds) the suppression lasts?
    cooldown-seconds: 10
    # Time window (in seconds) to count activations
    window-seconds: 2
    # Notify admins when a chunk is suppressed?
    notify: true
    
    # Advanced Limiting (Frequency & Pistons)
    advanced:
      enabled: true
      # Max Redstone events per block per second
      max-frequency: 25
      # Piston Limiter: Max pushes per chunk per tick
      piston-limit:
        enabled: true
        # Track moving pistons (complex geometry)? turning this off improves performance
        track-moving-blocks: true
        max-pushes-per-chunk: 50

    # Long-term Detection (Slow but persistent clocks)
    # NOTE: Runtime reads this section from modules.redstone.long-term.*
    long-term:
      enabled: true
      # Window duration (seconds) to track activations
      window-seconds: 120
      # Max activations allowed in this window
      max-activations: 300
      # Actions to take
      actions:
        - "notify-admin"
        - "break-block" # Drops item naturally

  # -----------------------------------------------------------
  # Entity Management
  # Controls entity counts and limits to prevent overload.
  # -----------------------------------------------------------
  entities:
    # Global limit enforcement
    limits:
      enabled: true
      # Check interval in ticks (600 = 30s)
      check-interval: 600
      # Max entities per chunk by type
      per-chunk-limit:
        monster: 30
        animal: 15
        water_animal: 5
        ambient: 5
        misc: 10
      # Max entities per WORLD by type (Hard limit)
      per-world-limit:
        monster: 2000
        animal: 1000
        water_animal: 500
        ambient: 200
        misc: 200
        default: 1000 # Fallback for other types
      # Protected entities (Metadata/NBT)
      protected-metadata:
        - "NPC"
        - "Shop"
      protected-names:
        - "Nametagged Mob"

    # Smart Chunk Limiter (Removes excess entities)
    chunk-limiter:
      enabled: true
      # Max total entities per chunk before cleanup triggers
      max-entities-per-chunk: 50
      # How often to scan loaded chunks (in seconds)
      scan-interval: 30
      whitelist:
        - "PLAYER"
        - "VILLAGER"
        - "IRON_GOLEM"
        - "HORSE"
        - "WOLF"
        - "CAT"

  # -----------------------------------------------------------
  # Breeding Limiter (Proactive Farm Control)
  # Prevents breeding if the per-chunk animal cap is reached.
  # -----------------------------------------------------------
  breeding-limiter:
    enabled: true
    # Max animals of same type per chunk allowed for breeding
    max-animals-per-chunk: 20
    # Message sent to player (set to "" to disable)
    message: "<red>Farm limit reached! Cannot breed more animals in this chunk."

  # -----------------------------------------------------------
  # Spawner Limiter (Inspired by MobLimit)
  # Limits the number of a specific mob type that a spawner can produce
  # within a configurable chunk radius. Fully Folia-compatible.
  # -----------------------------------------------------------
  spawner-limiter:
    enabled: true
    # CANCEL: prevent the spawn entirely
    # DUMB:   allow spawn but immediately disable AI (loot drops still work)
    action: CANCEL
    # Chunk radius to count entities in. 0 = spawner's chunk only.
    # 1 = 3x3 chunks (~48 block radius), 2 = 5x5 chunks (~80 block radius)
    radius-chunks: 1
    # Per-entity-type limits. Types not listed below use global-limit.
    # -1 = disabled (no limit for that type)
    global-limit: -1
    limits:
      ZOMBIE: 24
      ZOMBIE_VILLAGER: 16
      SKELETON: 24
      STRAY: 16
      HUSK: 16
      SPIDER: 24
      CAVE_SPIDER: 20
      CREEPER: 20
      BLAZE: 16
      MAGMA_CUBE: 30
      SLIME: 30
      SILVERFISH: 20
      ENDERMAN: 12

  # -----------------------------------------------------------
  # Block Placement Limiter (Inspired by Insights)
  # Preventively cancels placement of lag-heavy blocks when the
  # per-chunk count exceeds the configured limit.
  # Bypass permission: lesslag.block-limit.bypass
  # Fully Folia-compatible (event fires on the chunk's regional thread).
  # -----------------------------------------------------------
  block-placement-limiter:
    enabled: true
    # Action bar message shown to the player on block deny.
    # Placeholders: %material%, %count%, %limit%
    # Set to "" to disable player notifications.
    message: "<red>Chunk limit reached! Cannot place more <yellow>%material% <red>in this chunk (%count%/%limit%)."
    # Per-material limits (material name: max blocks allowed per chunk)
    limits:
      # Tile entities — counted instantly via getTileEntities() (fast)
      HOPPER: 32
      DISPENSER: 32
      DROPPER: 32
      FURNACE: 48
      BLAST_FURNACE: 32
      SMOKER: 32
      CHEST: 128
      TRAPPED_CHEST: 64
      # Non-tile blocks — counted async + cached (zero event-thread cost)
      PISTON: 64
      STICKY_PISTON: 64
      OBSERVER: 48
      COMPARATOR: 96
      REPEATER: 96
      REDSTONE_LAMP: 128

  # -----------------------------------------------------------
  # Movement Speed & Chunk Load Limiter
  # Prevents players from exploring/flying too fast and crashing the server.
  # -----------------------------------------------------------
  movement-limiter:
    enabled: true
    # Maximum number of chunk borders a player can cross per second.
    # Note: 1 chunk = 16 blocks. Normal flight is rarely > 10 chunks/sec.
    max-chunks-per-second: 20
    # The action to take: "rubberband" (pulls them back) or "cancel" (freezes them)
    action: "rubberband"
    # Should we cancel their velocity? (Extremely useful against Elytra launchers)
    cancel-velocity: true
    # Send a warning message to the player?
    message: "<red>You are moving too fast! Server needs time to load chunks."
    # Notify admins?
    notify-admin: true

  # -----------------------------------------------------------
  # Chunk Management
  # View/simulation distance bounds used by automation actions.
  # -----------------------------------------------------------
  chunks:
    enabled: true

    # View Distance Action Settings
    view-distance:
      min: 4
      reduce-by: 2

    # Simulation Distance Action Settings
    simulation-distance:
      min: 4
      reduce-by: 2

    # [EMERGENCY] World Chunk Guard: Unloads chunks in overloaded worlds
    # Last-resort circuit breaker — forcibly unloads chunks and can evacuate players.
    # Keep disabled unless you fully understand the disruptive behavior.
    world-guard:
      enabled: false
      # Notify admins when world overload handling is triggered
      notify: true
      # Check interval in ticks
      check-interval: 1200
      # Threshold: Loaded chunks per player
      max-chunks-per-player: 200
      # Multiplier for overload detection (e.g. 2.0 = 200% of limit)
      overload-multiplier: 2.0
      # Max retries before evacuating players to spawn
      max-retries: 5
      # World to evacuate to
      evacuate-world: "world"
      # Exempt specific worlds from WorldChunkGuard
      ignored-worlds:
        - "lobby"
      # Skip spawn chunks of a world if keepSpawnInMemory is enabled (helps with Multiverse-Core hooks)
      keep-spawn-loaded: true
      # Actions if threshold exceeded
      # "unload-unused" is disabled by default for safety. Enable if you want aggressive unloading.
      actions:
        - "notify-admin"
        - "reduce-view-distance"
        # - "unload-unused"

    # General Unload Settings
    unload-unused: true
    keep-spawn-loaded: true

  # ===========================================================
  #  MODULES — Advanced Farm Optimization  [ADVANCED]
  #  Disabled by default. Enable when farms are a confirmed lag source.
  # ===========================================================

  # -----------------------------------------------------------
  # [ADVANCED] Villager Optimizer (Happy Villagers)
  # Disables AI for trapped villagers to reduce trading hall lag.
  # Recommended for servers with large trading halls.
  # Inspired by VillagerLobotomizer & AntiVillagerLag.
  # -----------------------------------------------------------
  villager-optimizer:
    enabled: false
    # Check interval in ticks (600 = 30s)
    check-interval: 600
    # How long to re-enable AI after interaction (seconds)
    ai-restore-duration: 30
    # Only optimize trapped villagers? (1x1 cells)
    optimize-trapped: true
    # Make lobotomized villagers silent (reduces audio processing)
    silent-when-lobotomized: true
    # Persist lobotomized state in NBT/PDC across chunk unloads.
    # Prevents re-scan lag spike when chunks reload.
    persist-state: true
    # Cancel zombie attacks on lobotomized villagers (they can't flee)
    zombie-protection: true
    # Automatically restock trades for lobotomized villagers on a schedule.
    # Mimics the vanilla restock that would happen if they could reach workstations.
    auto-restock:
      enabled: true
      # How often to restock, in ticks (24000 = 1 minecraft day)
      interval-ticks: 24000
    # Villagers whose name CONTAINS any of these strings will NEVER be lobotomized.
    # Use for display/main villagers you always want active.
    always-active-names:
      - "alwaysbrain"
      - "main"
    # Villagers whose name CONTAINS any of these strings are ALWAYS lobotomized,
    # even without a profession or 1x1 trap. Useful for creative trading halls.
    always-inactive-names:
      - "nobrain"

  # -----------------------------------------------------------
  # [ADVANCED] Density Optimizer (Farm Performance)
  # Disables AI/Collision for specific mobs in varying density.
  # Recommended for servers with high-density animal farms.
  # -----------------------------------------------------------
  density-optimizer:
    enabled: false
    # Check interval in ticks (40 = 2s)
    check-interval: 40
    # Mobs to optimize (Type: Threshold)
    # If chunk has > Threshold of Type, excess will have AI disabled.
    limits:
      COW: 10
      SHEEP: 10
      PIG: 10
      CHICKEN: 15
      VILLAGER: 20
    # Always keep these mobs active (even if over limit)
    # Useful for "pet" protection if they are in the farm
    bypass-tamed: true
    bypass-named: true
    bypass-leashed: true

  # -----------------------------------------------------------
  # [ADVANCED] Mob Farm Optimizer (Inspired by FarmControl)
  # Disables AI for hostile mobs in dark, player-free areas (mob grinders).
  # CPU savings: stops random stroll/look goals when mobs are purely waiting.
  # Recommended for servers with dedicated mob grinders.
  # -----------------------------------------------------------
  mob-farm-optimizer:
    enabled: false
    # Scan interval in ticks (300 = 15 seconds)
    check-interval: 300
    # Light level at or below which a mob is considered "in a dark farm"
    # 0 = torch-free dark room, 7 = full darkness threshold
    max-light-level: 0
    # If any player is within this many blocks, keep mob AI active
    player-activation-range: 24.0
    # Restrict optimization to specific entity types.
    # Leave empty to apply to ALL hostile mobs.
    types: []

  # ===========================================================
  #  MODULES — Experimental  [EXPERIMENTAL]
  #  Complex heuristics. May produce false positives on most servers.
  # ===========================================================

  # -----------------------------------------------------------
  # [EXPERIMENTAL] AI Optimization (Frustum Culling)
  # Disables AI for mobs that are far away or out of sight.
  # High complexity with marginal gains on most servers.
  # Enable only if you understand PDC state management trade-offs.
  # -----------------------------------------------------------
  mob-ai:
    enabled: false
    # Radius around player where mobs have active AI
    active-radius: 40
    # Update interval in ticks (30 = 1.5s)
    update-interval: 30
    # Mobs that should ALWAYS have AI
    protected:
      - "ENDER_DRAGON"
      - "WITHER"
      - "VILLAGER"
      - "Raider"
    # Advanced Frustum Culling Settings
    fov-degrees: 100.0
    behind-safe-radius: 10.0

# =============================================================
#  SYSTEM — Core Monitoring & Diagnostics
# =============================================================

system:
  # TPS & MSPT Monitor — powers /lg status, /lg tps, and threshold automation
  tps-monitor:
    enabled: true
    # Interval to check TPS (in ticks)
    check-interval: 100
    # History length (in seconds)
    history-length: 60

  # Tick Spike Monitor — powers /lg tickmonitor
  tick-monitor:
    enabled: true
    # Threshold to log a tick spike (ms)
    threshold-ms: 100
    # Log to console?
    log-to-console: true
    # Minimum gap between consecutive spike notifications (ms). Prevents chat spam.
    spike-cooldown-ms: 1000

  # ===========================================================
  #  SYSTEM — Advanced Diagnostics  [ADVANCED]
  # ===========================================================

  # [ADVANCED] Lag Source Analyzer — /lg sources
  lag-source-analyzer:
    enabled: true
    # Auto-analyze if TPS drops below X?
    auto-analyze-tps: 16.5
    thresholds:
      entity-count: 500
      chunk-count: 800
      task-count: 20
      top-entities: 3
      density: 50
      chunk-rate-warn: 10.0

  # [ADVANCED] Garbage Collection Monitor
  # Alerts admins to GC pauses that degrade TPS predictability.
  gc-monitor:
    enabled: true
    # Notify if GC pause exceeds this (ms)
    warn-threshold-ms: 300
    # Notify online admins about long GC pauses
    notify: true
    # How often to poll GC stats (milliseconds). Lower = more responsive, higher = less overhead.
    check-interval-ms: 2000

  # ===========================================================
  #  SYSTEM — Experimental Diagnostics  [EXPERIMENTAL]
  # ===========================================================

  # [EXPERIMENTAL] Memory Leak Detector
  # Uses statistical regression on JVM old-gen memory — prone to false positives.
  # Only useful on servers where you suspect actual Java heap growth leaks.
  memory-leak-detection:
    enabled: false
    # Check interval (in minutes)
    check-interval-minutes: 10
    # Number of consecutive rising-slope signals required before alerting.
    # Higher = fewer false positives; lower = faster detection.
    consecutive-signals: 3
    # Notify admins in-game? (Set to false for console-only logs)
    notify: false
    # Warn if old gen memory grows by this slope (MB/min)
    warn-slope-threshold: 2.0
    # Advanced tuning
    window-size: 20
    min-samples: 8
    alert-cooldown: 300

  # [EXPERIMENTAL] Bottleneck Analyzer (Async Main Thread Watchdog)
  # Samples the main thread when a tick takes too long and identifies the culprit.
  # Prone to false positives — useful as a hint, not as forensic proof.
  bottleneck-analyzer:
    enabled: false
    # If the main thread takes longer than this to tick, start sampling.
    # GC pauses / OS scheduling can cause ~100ms blips — keep this above 150ms.
    threshold-ms: 150
    # How often to sample the thread while it's frozen
    sample-interval-ms: 5
    # Minimum samples required before reporting (threshold-ms / sample-interval-ms = 30 samples
    # for a 150ms spike — requiring 10 means the spike must last at least 200ms total)
    min-samples: 10
    # Minimum time between reported spikes (prevents chat spam)
    report-cooldown-ms: 30000
    # Minimum fraction of samples that must point to the SAME method (0.0–1.0).
    # GC pauses scatter samples randomly across many methods → no single method reaches 40%.
    # A real bottleneck (e.g. bad plugin code) concentrates samples → one method hits 60%+.
    # Raise this to reduce false positives; lower it if you want broader diagnostics.
    min-concentration: 0.40
    # Ignore spikes during the first N milliseconds after server start.
    # JVM JIT compilation causes heavy false positives in the first ~60 seconds.
    startup-ignore-ms: 60000

# =============================================================
#  AUTOMATION: Predictive & Thresholds
# =============================================================

automation:
  # Number of consecutive bad samples before threshold actions run
  trigger-count: 3

  # Predictive Optimizer (Trend Analysis)
  predictive-optimization:
    enabled: true
    # Sample window size in seconds
    window-seconds: 10
    # Trigger if MSPT slope exceeds this (ms/s)
    slope-threshold: 3.0
    # Baseline MSPT required before taking predictive actions
    mspt-baseline: 30.0
    # Cooldown between triggers (seconds)
    cooldown: 60
    # Send admin notifications when predictive optimization triggers
    notify: true
    # Action to take
    action: "notify-admin"
    # Preferred multi-action format (if set, this list is used)
    actions:
      - "notify-admin"

  # TPS Thresholds (Triggers actions based on TPS)
  thresholds:
    # Level 1: Minor Lag
    minor:
      tps: 18.0
      notify:
        actionbar: true
      actions:
        - "reduce-view-distance"
    # Level 2: Moderate Lag
    moderate:
      tps: 15.0
      notify:
        actionbar: true
        chat: true
      actions:
        - "disable-mob-ai"
        - "clear-ground-items"
        - "clear-xp-orbs"
    # Level 3: Critical Lag
    critical:
      tps: 10.0
      notify:
        actionbar: true
        chat: true
        sound: "ENTITY_ENDERMAN_DEATH"
      actions:
        - "disable-mob-ai"
        - "clear-ground-items"
        - "clear-xp-orbs"
        - "reduce-simulation-distance"

# =============================================================
#  COMPATIBILITY
# =============================================================

compatibility:
  min-version: "1.20.4"
  allow-unsupported-versions: false

  # Automatically detect and adjust for other plugins
  auto-detect: true
  plugins:
    # Disable LessLag's AI optimization if Pufferfish/DAB is present
    pufferfish-dab: true
    # Disable LessLag's entity clearing if ClearLag is present
    clearlag: true
    # Disable LessLag's stacker/spawner logic if MobFarmManager is present
    mobfarmmanager: true
    # Detect and avoid sweeping CMI holograms & armor stands
    cmi: true
    # Detect and avoid sweeping HolographicDisplays / DecentHolograms
    holograms: true
    # Detect and avoid sweeping ItemsAdder / Oraxen furniture
    custom-items: true
    # Detect and avoid sweeping EvenMoreFish items
    evenmorefish: true
    # Detect and avoid sweeping FancyNpcs NPCs
    fancynpcs: true
    # Detect and avoid sweeping FancyHolograms 
    fancyholograms: true
    # Detect and avoid sweeping DecentHolograms
    decentholograms: true
    # Detect Leaf server and adjust AI modules
    leaf: true
    # Detect LagFixer and adjust overlapping modules
    lagfixer: true

# =============================================================
#  HEALTH REPORT (/lg health)
# =============================================================

health-report:
  tps: true
  mspt: true
  cpu: true
  memory: true
  disk: true
  worlds: true
  entity-breakdown: true

# =============================================================
#  PREMIUM FEATURES
# =============================================================

premium:
  enabled: false
  discord:
    webhook-url: "" # Paste your Discord Webhook URL here
    alert-tps-threshold: 18.0

  # Player Scaler (Auto-Scale Settings by Player Count)
  player-scaler:
    enabled: true
    # How often to check player count (in ticks) - also checks on Join/Quit
    check-interval: 600
    
    # Smart Mode: Increases "virtual" player count when TPS drops.
    # This forces stricter settings during lag, even with few players.
    smart-mode:
      enabled: true
      # How many "virtual players" to add per 1.0 TPS drop below 20.
      # Example: 15 TPS (5 drop) * sensitivity 5 = +25 virtual players.
      sensitivity: 5.0
      # Only apply penalty if TPS is below this value
      min-tps-check: 19.5
    
    # Define tiers based on player count (Sorted by min-players desc)
    tiers:
      low:
        min-players: 0
        view-distance: 10
        simulation-distance: 8
        max-entities-per-chunk: 50
        spawn-limits:
          monsters: 70
          animals: 10
        density-limit: -1 # Disabled
        breeding-limit: 20
        redstone-limit: 500
        activation-range: 48
      medium:
        min-players: 20
        view-distance: 8
        simulation-distance: 6
        max-entities-per-chunk: 35
        spawn-limits:
          monsters: 50
          animals: 8
        density-limit: 15
        breeding-limit: 15
        redstone-limit: 300
        activation-range: 32
      high:
        min-players: 50
        view-distance: 6
        simulation-distance: 4
        max-entities-per-chunk: 20
        spawn-limits:
          monsters: 30
          animals: 5
        density-limit: 10
        breeding-limit: 10
        redstone-limit: 100
        activation-range: 16
      extreme:
        min-players: 100
        view-distance: 4
        simulation-distance: 4
        max-entities-per-chunk: 10
        spawn-limits:
          monsters: 15
          animals: 2
        density-limit: 5
        breeding-limit: 5
        redstone-limit: 50
        activation-range: 8

notifications:
  # Global defaults for threshold notifications
  chat: true
  actionbar: true
  sound: false
  # Cooldown in seconds for repetitive admin warnings
  cooldown: 10
  # Broadcast to all players when an action (like clearing items) finishes
  broadcast-actions: false

# =============================================================
#  RECOVERY
#  Automatically restores server settings once TPS stabilizes.
# =============================================================
recovery:
  enabled: true
  # TPS value at which the server is considered recovered
  tps-threshold: 18.0
  # Seconds TPS must remain above threshold before restoring defaults
  delay-seconds: 30

# =============================================================
#  MESSAGES
#  Player-visible alerts sent by the monitoring system.
#  Uses MiniMessage formatting. Available placeholders noted inline.
# =============================================================
messages:
  # Sent to online admins when lag triggers an automated action. {tps} available.
  broadcast-emergency: "<red><bold>[!] <white>Server is experiencing lag, auto-fix in progress..."
  # Sent to admins when TPS recovers and settings are restored. {tps} = current TPS.
  recovery: "<green>\u2714 TPS stabilized: {tps}"
  # Sent to admins when a tick spike is detected. {duration} = ms.
  tick-spike: "<yellow>\u26a0 Tick spike: <white>{duration}ms <gray>(normal: 50ms)"
  # Sent to admins during bottleneck profiling. {duration}ms, {method}, {percent}%.
  bottleneck-detected: "<red><bold>LAG SPIKE! <gray>({duration}ms) Caused by: <yellow>{method} <gray>({percent}%)"

# =============================================================
#  SETUP ADVISOR
#  Auto-detects hardware, platform, plugins and recommends
#  an optimal configuration profile for your server.
# =============================================================
